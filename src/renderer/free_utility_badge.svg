<svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" width="320" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent" />
      <stop offset="35%" style="stop-color:#aaaaaa;stop-opacity:0.1" />
      <stop offset="55%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#d0d0d0;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:transparent" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="316" height="76" rx="18" ry="18" fill="url(#bgGrad)" />

  <!-- Static dim border -->
  <rect x="2" y="2" width="316" height="76" rx="18" ry="18"
        fill="none" stroke="#2a2a2a" stroke-width="1.5" />

  <!-- Animated primary glow line (~766px perimeter) -->
  <rect x="2" y="2" width="316" height="76" rx="18" ry="18"
        fill="none"
        stroke="url(#lineGrad)"
        stroke-width="2.5"
        stroke-dasharray="130 636"
        filter="url(#glow)">
    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-766"
      dur="2.5s"
      repeatCount="indefinite"
      calcMode="linear"
    />
  </rect>

  <!-- Trailing shimmer -->
  <rect x="2" y="2" width="316" height="76" rx="18" ry="18"
        fill="none"
        stroke="#e0e0e0"
        stroke-width="1"
        stroke-dasharray="50 716"
        stroke-dashoffset="70"
        opacity="0.4"
        filter="url(#glow)">
    <animate
      attributeName="stroke-dashoffset"
      from="70"
      to="-696"
      dur="2.5s"
      repeatCount="indefinite"
      calcMode="linear"
    />
  </rect>

  <!-- Check circle -->
  <circle cx="44" cy="40" r="13" fill="none" stroke="#aaaaaa" stroke-width="1.8" />
  <polyline points="38,40 42,45 51,34"
            fill="none" stroke="#aaaaaa" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Text: FREE UTILITY side by side -->
  <text x="100" y="46"
        font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif"
        font-size="15"
        font-weight="700"
        letter-spacing="3.5"
        fill="#e8e8e8">FREE</text>

  <text x="162" y="46"
        font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif"
        font-size="15"
        font-weight="300"
        letter-spacing="4"
        fill="#888899">UTILITY</text>
</svg>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .wrapper {
    position: relative;
    width: 228px;
    height: 58px;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    border-radius: 14px;
  }
  .inner {
    position: absolute;
    top: 0; left: 0;
    width: 228px;
    height: 58px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    pointer-events: none;
    z-index: 2;
  }
  .label {
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #e8e8e8;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrapper">
  <canvas id="c" width="228" height="58"></canvas>
  <div class="inner">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="11" cy="11" r="9.5" stroke="#c9a227" stroke-width="1.6"/>
      <polyline points="6.5,11 9.5,14 15.5,8" stroke="#c9a227" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="label">FREE UTILITY</span>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 228, H = 58, R = 14;
const DURATION = 4000;

function buildPath(w, h, r, samples) {
  const pts = [];
  const perim = 2*(w-2*r) + 2*(h-2*r) + 2*Math.PI*r;

  function arc(cx, cy, a0, a1) {
    const n = Math.round(samples * (Math.abs(a1-a0)*r) / perim);
    for (let i = 0; i <= n; i++) {
      const a = a0 + (a1-a0)*i/n;
      pts.push({ x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) });
    }
  }
  function line(x0,y0,x1,y1) {
    const len = Math.hypot(x1-x0,y1-y0);
    const n = Math.round(samples * len / perim);
    for (let i = 0; i <= n; i++) pts.push({ x: x0+(x1-x0)*i/n, y: y0+(y1-y0)*i/n });
  }

  line(r, 0, w-r, 0);
  arc(w-r, r, -Math.PI/2, 0);
  line(w, r, w, h-r);
  arc(w-r, h-r, 0, Math.PI/2);
  line(w-r, h, r, h);
  arc(r, h-r, Math.PI/2, Math.PI);
  line(0, h-r, 0, r);
  arc(r, r, Math.PI, 3*Math.PI/2);

  return pts;
}

const PATH = buildPath(W, H, R, 1400);
const N = PATH.length;

function draw(ts) {
  ctx.clearRect(0, 0, W, H);

  // Background — dark pill with subtle inner glow (like the premium ref)
  const bg = ctx.createRadialGradient(W/2, H/2, 4, W/2, H/2, W*0.6);
  bg.addColorStop(0,   '#2a2a2a');
  bg.addColorStop(0.5, '#181818');
  bg.addColorStop(1,   '#0d0d0d');
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, R);
  ctx.fillStyle = bg;
  ctx.fill();

  // Static border
  ctx.beginPath();
  ctx.roundRect(0.75, 0.75, W-1.5, H-1.5, R);
  ctx.strokeStyle = '#2e2e2e';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Comet
  const progress = (ts % DURATION) / DURATION;
  const headIdx  = Math.floor(progress * N);
  const tailLen  = Math.floor(N * 0.20);

  ctx.save();
  // Clip to inside the border so glow stays inside
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, R);
  ctx.clip();

  for (let i = tailLen; i >= 0; i--) {
    const idx  = (headIdx - i + N) % N;
    const next = (idx + 1) % N;
    const frac = 1 - i / tailLen;
    const alpha = Math.pow(frac, 1.8);
    const brightness = Math.round(160 + 95 * frac);

    ctx.beginPath();
    ctx.moveTo(PATH[idx].x, PATH[idx].y);
    ctx.lineTo(PATH[next].x, PATH[next].y);
    ctx.strokeStyle = `rgba(${brightness},${brightness},${brightness},${alpha})`;
    ctx.lineWidth   = 1.2 + frac * 1.8;
    ctx.shadowColor = `rgba(255,255,255,${alpha * 0.85})`;
    ctx.shadowBlur  = 4 + frac * 12;
    ctx.stroke();
  }

  // Bright head spark
  const tip = PATH[headIdx];
  ctx.beginPath();
  ctx.arc(tip.x, tip.y, 1.5, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(255,255,255,1)';
  ctx.shadowBlur  = 16;
  ctx.fill();

  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>

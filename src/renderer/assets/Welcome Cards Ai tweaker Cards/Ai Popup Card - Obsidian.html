<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tweaker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  }

  .card {
    background: linear-gradient(160deg, #141418 0%, #0e0e14 60%, #0a0a0f 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 28px;
    width: 340px;
    padding: 36px 28px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 40px 80px rgba(0,0,0,0.6),
      0 0 120px rgba(255,255,255,0.03);
  }

  /* Subtle gradient sheen top */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 30% at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── SVG orb ── */
  .orb-wrap {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 24px;
  }

  #orb-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* particle canvas sits on top */
  #particle-canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ── Typography ── */
  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #ffffff;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 13.5px;
    font-weight: 400;
    line-height: 1.6;
    color: rgba(255,255,255,0.45);
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 11px;
    font-weight: 400;
    color: rgba(255,255,255,0.22);
    letter-spacing: 0.3px;
    margin-bottom: 24px;
  }

  /* ── Checkbox ── */
  .checkbox-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    cursor: pointer;
    user-select: none;
  }

  .checkbox-row input[type="checkbox"] {
    appearance: none;
    width: 15px;
    height: 15px;
    border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s, background 0.2s;
  }

  .checkbox-row input[type="checkbox"]:checked {
    background: rgba(255,255,255,0.85);
    border-color: rgba(255,255,255,0.85);
  }

  .checkbox-row input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 1px;
    width: 5px;
    height: 8px;
    border: 1.5px solid #0a0a0f;
    border-top: none;
    border-left: none;
    transform: rotate(40deg);
  }

  .checkbox-row label {
    font-size: 12.5px;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
  }

  /* ── CTA button ── */
  .btn {
    display: block;
    width: 100%;
    padding: 15px 0;
    border-radius: 14px;
    border: none;
    background: #ffffff;
    color: #0a0a0f;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.1px;
    cursor: pointer;
    transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
    box-shadow: 0 2px 16px rgba(255,255,255,0.08);
  }

  .btn:hover {
    background: #f0f0f0;
    transform: translateY(-1px);
    box-shadow: 0 4px 24px rgba(255,255,255,0.14);
  }

  .btn:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

<div class="card">
  <div class="orb-wrap">
    <canvas id="particle-canvas" width="220" height="220"></canvas>
    <svg id="orb-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Radial glow for core -->
        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
          <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.03"/>
          <stop offset="100%" stop-color="#0a0a0f"  stop-opacity="0"/>
        </radialGradient>

        <!-- Glow filter for lines -->
        <filter id="lineGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="1.8" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <!-- Intense glow for dot -->
        <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <!-- Clip inner circle -->
        <clipPath id="innerClip">
          <circle cx="80" cy="80" r="46"/>
        </clipPath>
      </defs>

      <!-- Background glow disc -->
      <circle cx="80" cy="80" r="70" fill="url(#coreGlow)"/>

      <!-- Dark inner sphere -->
      <circle cx="80" cy="80" r="46"
        fill="#0d0d12"
        stroke="rgba(255,255,255,0.06)"
        stroke-width="0.5"/>

      <!-- Inner sphere sheen -->
      <circle cx="80" cy="80" r="46" fill="url(#sphereSheen)" clip-path="url(#innerClip)"/>
      <defs>
        <radialGradient id="sphereSheen" cx="38%" cy="28%" r="55%">
          <stop offset="0%"  stop-color="rgba(255,255,255,0.06)"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>

      <!-- Crosshair lines (Apple precision feel) -->
      <g filter="url(#lineGlow)" opacity="0.7">
        <!-- Horizontal -->
        <line x1="56" y1="80" x2="104" y2="80" stroke="rgba(255,255,255,0.55)" stroke-width="0.8"/>
        <!-- Vertical -->
        <line x1="80" y1="56" x2="80"  y2="104" stroke="rgba(255,255,255,0.55)" stroke-width="0.8"/>
        <!-- Diagonal accents -->
        <line x1="62" y1="62" x2="98" y2="98" stroke="rgba(255,255,255,0.10)" stroke-width="0.5"/>
        <line x1="98" y1="62" x2="62" y2="98" stroke="rgba(255,255,255,0.10)" stroke-width="0.5"/>
      </g>

      <!-- Center dot -->
      <circle cx="80" cy="80" r="2.5" fill="white" opacity="0.9" filter="url(#dotGlow)"/>

      <!-- ── Outer orbit ring (dashed, rotates via JS) ── -->
      <g id="orbit-group">
        <circle cx="80" cy="80" r="66"
          fill="none"
          stroke="rgba(255,255,255,0.09)"
          stroke-width="0.6"
          stroke-dasharray="4 8"/>

        <!-- Bright travelling dot on orbit -->
        <circle id="travel-dot" cx="146" cy="80" r="3"
          fill="white"
          filter="url(#dotGlow)"/>

        <!-- Bright arc trailing behind dot (shorter, sharp) -->
        <path id="trail-arc"
          fill="none"
          stroke="rgba(255,255,255,0.55)"
          stroke-width="1"
          stroke-linecap="round"
          filter="url(#lineGlow)"/>
      </g>

      <!-- ── Second inner orbit (counter-rotates) ── -->
      <g id="inner-orbit">
        <circle cx="80" cy="80" r="54"
          fill="none"
          stroke="rgba(255,255,255,0.06)"
          stroke-width="0.5"/>
        <circle id="inner-dot" cx="134" cy="80" r="1.8"
          fill="white"
          filter="url(#dotGlow)"/>
      </g>

      <!-- Outer subtle ring -->
      <circle cx="80" cy="80" r="72"
        fill="none"
        stroke="rgba(255,255,255,0.03)"
        stroke-width="0.5"/>
    </svg>
  </div>

  <h1 class="title">Welcome to AI Tweaker</h1>
  <p class="subtitle">Your personal optimization assistant for gaming performance, latency reduction, cleanup, and deep system tuning.</p>
  <p class="tagline">Private. On-device. Built into XTweaks.</p>

  <label class="checkbox-row">
    <input type="checkbox" id="dontShow"/>
    <span>Don't show this again</span>
  </label>

  <button class="btn">Continue</button>
</div>

<script>
// ════════════════════════════════════════════════
// ⚙️  SPEED CONFIG — tweak these to customise
// ════════════════════════════════════════════════
const SPEED = {
  orbitOuter:   0.0015,  // outer ring dot spin   (lower = slower)
  orbitInner:   0.0022,  // inner ring dot spin    (lower = slower)
  trailLength:  1.2,     // arc length in radians  (bigger = longer trail)
  float:        0.3,     // orb bob up/down speed  (lower = slower)
  floatDist:    4,       // bob distance in px     (lower = less movement)
  particleDrift: 0.28,   // particle wander speed  (lower = calmer)
  particlePulse: 0.18,   // particle fade pulse    (lower = steadier)
};
// ════════════════════════════════════════════════

// ── Particle system ──────────────────────────────────────────────
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;

const particles = [];
const COUNT = 38;

function randBetween(a, b) { return a + Math.random() * (b - a); }

for (let i = 0; i < COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist  = randBetween(30, 95);
  particles.push({
    x: CX + Math.cos(angle) * dist,
    y: CY + Math.sin(angle) * dist,
    baseX: CX + Math.cos(angle) * dist,
    baseY: CY + Math.sin(angle) * dist,
    r: randBetween(0.4, 1.4),
    alpha: randBetween(0.1, 0.5),
    speed: randBetween(0.0004, 0.0012),
    phase: Math.random() * Math.PI * 2,
    drift: randBetween(2, 6),
    color: '#ffffff',
  });
}

let t = 0;
function drawParticles() {
  ctx.clearRect(0, 0, W, H);
  t += 0.016;
  for (const p of particles) {
    const wobble = Math.sin(t * p.speed * SPEED.particleDrift * 3000 + p.phase);
    const wobble2 = Math.cos(t * p.speed * SPEED.particleDrift * 2400 + p.phase);
    p.x = p.baseX + wobble * p.drift;
    p.y = p.baseY + wobble2 * p.drift;

    const pulse = 0.5 + 0.5 * Math.sin(t * p.speed * SPEED.particlePulse * 3000 + p.phase);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.8 + 0.4 * pulse), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha * (0.5 + 0.5 * pulse);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── SVG orbit animation ──────────────────────────────────────────
const orbitGroup   = document.getElementById('orbit-group');
const innerOrbit   = document.getElementById('inner-orbit');
const travelDot    = document.getElementById('travel-dot');
const innerDot     = document.getElementById('inner-dot');
const trailArc     = document.getElementById('trail-arc');

let orbitAngle = 0;
let innerAngle = Math.PI;

const R  = 66; // outer orbit radius
const Ri = 54; // inner orbit radius

function arcPath(cx, cy, r, startAngle, endAngle) {
  // draws arc going counter clockwise from startAngle to endAngle
  const x1 = cx + r * Math.cos(startAngle);
  const y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle);
  const y2 = cy + r * Math.sin(endAngle);
  // large arc flag: if sweep > pi
  const diff = ((endAngle - startAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const large = diff > Math.PI ? 1 : 0;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

function animateSVG() {
  orbitAngle += SPEED.orbitOuter;
  innerAngle -= SPEED.orbitInner;

  // main travelling dot
  const dx = 80 + R * Math.cos(orbitAngle);
  const dy = 80 + R * Math.sin(orbitAngle);
  travelDot.setAttribute('cx', dx);
  travelDot.setAttribute('cy', dy);

  // trail arc: ~70deg behind
  const trailStart = orbitAngle - SPEED.trailLength;
  trailArc.setAttribute('d', arcPath(80, 80, R, trailStart, orbitAngle));

  // inner dot
  innerDot.setAttribute('cx', 80 + Ri * Math.cos(innerAngle));
  innerDot.setAttribute('cy', 80 + Ri * Math.sin(innerAngle));
}

// ── Gentle float of the whole orb ───────────────────────────────
const orbWrap = document.querySelector('.orb-wrap');
let floatT = 0;
function floatOrb() {
  floatT += 0.016;
  const y = Math.sin(floatT * SPEED.float) * SPEED.floatDist;
  orbWrap.style.transform = `translateY(${y}px)`;
}

// ── Main loop ────────────────────────────────────────────────────
function loop() {
  drawParticles();
  animateSVG();
  floatOrb();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
